<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSCEqMonitor(β)0.10.5</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v1.2.0/maptiler-sdk.umd.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v1.2.0/maptiler-sdk.css" rel="stylesheet" />
    <script src="https://cdn.maptiler.com/leaflet-maptilersdk/v2.0.0/leaflet-maptilersdk.js"></script>
    <script src="./scripts/main.mjs" type="module"></script>
</head>

<body>

    <!-- 地図を表示するコンテナ -->
    <div id="map">
        <div id="titleArea" class="map-items">
            <span id="eqinfoType">読み込み中</span>
        </div>

        <div id="timeArea" class="map-items">
            <label for="publishedTime">発表時刻</label>
            <span id="publishedTime"></span>
        </div>

        <div id="eqinfoArea" class="map-items">
            <div>
                <div>
                    <label for="eqinfoTime">発生時刻: </label>
                    <span id="eqinfoTime"></span>
                </div>

                <div class="eqinfoItems">
                    <label for="eqinfoHypo">震源地: </label>
                    <span id="eqinfoHypo"></span>
                </div>

                <div class="eqinfoItems">
                    <label for="eqinfoScale">最大震度: </label>
                    <span id="eqinfoScale"></span>
                </div>

                <div class="eqinfoItems">
                    <label for="eqinfoMag">マグニチュード: </label>
                    <span id="eqinfoMag"></span>
                </div>

                <div class="eqinfoItems">
                    <label for="eqinfoDepth">深さ: </label>
                    <span id="eqinfoDepth"></span>
                </div>

                <div class="eqinfoItems">
                    <label for="eqinfoTsunami">津波: </label>
                    <span id="eqinfoTsunami"></span>
                </div>
            </div>
        </div>

        <div id="iconSample" class="map-items">
            <div class="list">
                <img src="./images/hypocenter.png" alt="" srcset="">
                <span>震央</span>
            </div>

            <div class="list">
                <img src="./images/unknown.png" alt="" srcset="">
                <span>震度不明</span>
            </div>

            <div class="list">
                <img src="./images/1.png" alt="" srcset="">
                <span>震度１</span>
            </div>

            <div class="list">
                <img src="./images/2.png" alt="" srcset="">
                <span>震度２</span>
            </div>

            <div class="list">
                <img src="./images/3.png" alt="" srcset="">
                <span>震度３</span>
            </div>

            <div class="list">
                <img src="./images/4.png" alt="" srcset="">
                <span>震度４</span>
            </div>

            <div class="list">
                <img src="./images/5-.png" alt="" srcset="">
                <span>震度５弱</span>
            </div>

            <div class="list">
                <img src="./images/5+.png" alt="" srcset="">
                <span>震度５強</span>
            </div>

            <div class="list">
                <img src="./images/6-.png" alt="" srcset="">
                <span>震度６弱</span>
            </div>

            <div class="list">
                <img src="./images/6+.png" alt="" srcset="">
                <span>震度６強</span>
            </div>

            <div class="list">
                <img src="./images/7.png" alt="" srcset="">
                <span>震度７</span>
            </div>
        </div>
    </div>

    <!-- Mapbox GL JSライブラリを読み込む -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.6.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.6.1/mapbox-gl.css" rel="stylesheet">
</body>

</html>

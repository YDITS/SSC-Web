<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- meta -->
    <title>SSC for Web</title>
    <meta name="description" content="Saitama Sora Cam が提供する防災情報Webアプリケーション。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- icons -->
    <link rel="shortcut icon" type="image/x-icon"
        href="https://cdn.ydits.net/images/ydits-ssc-logos/ydits_for_ssc_icon_transparent.png">
    <link rel="apple-touch-icon-precomposed"
        href="https://cdn.ydits.net/images/ydits-ssc-logos/ydits_for_ssc_icon_transparent.png">
    <link rel="fluid-icon" href="https://cdn.ydits.net/images/ydits-ssc-logos/ydits_for_ssc_icon_transparent.png"
        title="SSC for Web">

    <!-- manifest -->
    <link rel="manifest" href="./ssc-web.webmanifest">

    <!-- styles -->
    <link rel="stylesheet" href="./styles/common.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v1.2.0/maptiler-sdk.css" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.6.1/mapbox-gl.css" rel="stylesheet">

    <!-- scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v1.2.0/maptiler-sdk.umd.js"></script>
    <script src="https://cdn.maptiler.com/leaflet-maptilersdk/v2.0.0/leaflet-maptilersdk.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.6.1/mapbox-gl.js"></script>
    <script src="./scripts/index.js" type="module"></script>
</head>

<body>
    <main>
        <div id="map" class="map">
            <div id="informationTitle" class="map__item information-title">
                <span id="informationTitleDisplay" class="information-display information-title__display"></span>
            </div>

            <div id="publishedTime" class="map__item published-time">
                <span id="publishedTimeDisplay" class="information-display published-time__display"></span>
                <label id="publishedTimeAfter" for="publishedTimeDisplay"
                    class="information-display__after published-time__after">
                    発表
                </label>
            </div>

            <div id="iconLegend" class="map__item icon-legend">
                <div class="icon-legend__item">
                    <img src="./images/v2/hypocenter.png" alt="" srcset="" class="icon-legend__image">
                    <span>震央</span>
                </div>

                <div class="icon-legend__item">
                    <img src="./images/v2/radius/unknown.png" alt="" srcset="" class="icon-legend__image">
                    <span>震度不明</span>
                </div>

                <div class="icon-legend__item">
                    <img src="./images/v2/radius/1.png" alt="" srcset="" class="icon-legend__image">
                    <span>震度１</span>
                </div>

                <div class="icon-legend__item ellipsis">
                    <span>～</span>
                </div>

                <div class="icon-legend__item">
                    <img src="./images/v2/square/7.png" alt="" srcset="" class="icon-legend__image">
                    <span>震度７</span>
                </div>
            </div>

            <div id="yditsCopyright" class="map__item ydits-copyright">
                <a class="ydits-copyright__link" href="https://www.ydits.net/" target="_blank">
                    <span id="yditsCopyrightBefore" class="ydits-copyright__before">
                        Powered by
                    </span>
                    <img id="yditsCopyrightImage" class="ydits-copyright__image"
                        src="https://cdn.ydits.net/images/ydits_logos/ydits_logo_white_transparent.png"
                        alt="YDITS's Logo">
                </a>
            </div>
        </div>

        <div id="informationDetails" class="information-details">
            <dl id="occurredTime" class="information-details__item occurred-time">
                <dt class="information-details__term occurred-time__term">
                    <label id="occurredTimeLabel" for="occurredTimeDisplay"
                        class="information-details__label occurred-time__label">
                        発生時刻
                    </label>
                </dt>

                <dd class="information-details__description occurred-time__description">
                    <span id="occurredTimeDisplay" class="information-details__display occurred-time__display"></span>
                </dd>
            </dl>

            <dl id="hypocenter" class="information-details__item hypocenter">
                <dt class="information-details__term hypocenter__term">
                    <label id="hypocenterLabel" for="hypocenterDisplay"
                        class="information-details__label hypocenter__label">
                        震源地
                    </label>
                </dt>

                <dd class="information-details__description hypocenter__description">
                    <span id="hypocenterDisplay" class="information-details__display hypocenter__display"></span>
                </dd>
            </dl>

            <dl id="maxInt" class="information-details__item max-int">
                <dt class="information-details__term max-int__term">
                    <label id="maxIntLabel" for="maxIntDisplay" class="information-details__label max-int__label">
                        最大震度
                    </label>
                </dt>

                <dd class="information-details__description max-int__description">
                    <span id="maxIntDisplay" class="information-details__display max-int__display"></span>
                </dd>
            </dl>

            <dl id="magnitude" class="information-details__item magnitude">
                <dt class="information-details__term magnitude__term">
                    <label id="magnitudeLabel" for="magnitudeDisplay"
                        class="information-details__label magnitude__label">
                        規模
                    </label>
                </dt>

                <dd class="information-details__description magnitude__description">
                    <span id="magnitudeDisplay" class="information-details__display magnitude__display"></span>
                </dd>
            </dl>

            <dl id="depth" class="information-details__item depth">
                <dt class="information-details__term depth__term">
                    <label id="depthLabel" for="depthDisplay" class="information-details__label depth__label">
                        深さ
                    </label>
                </dt>

                <dd class="information-details__description depth__description">
                    <span id="depthDisplay" class="information-details__display depth__display"></span>
                </dd>
            </dl>

            <dl id="tsunami" class="information-details__item tsunami">
                <dt class="information-details__term tsunami__term">
                    <label id="tsunamiLabel" for="tsunamiDisplay" class="information-details__label tsunami__label">
                        津波
                    </label>
                </dt>

                <dd class="information-details__description tsunami__description">
                    <span id="tsunamiDisplay" class="information-details__display tsunami__display"></span>
                </dd>
            </dl>
        </div>

        <div id="expandInformationDetails" class="expand-information-details">
            <button id="expandInformationDetailsButton" class="expand-information-details__button">
                <span class="open">
                    ＜&nbsp;地震情報
                </span>

                <span class="close">＞&nbsp;閉じる</span>
            </button>
        </div>

        <div id="debugModeMarker" class="debug-mode-marker">
            <span>Debug Mode</span>
        </div>
    </main>
</body>

</html>
